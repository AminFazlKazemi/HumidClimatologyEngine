[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humidclimatologyengine"
version = "11.5.0"
description = "Reproducible ERA5-Land moisture climatology engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amin Fazlkazemi"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "tqdm>=4.66",
  "psutil>=5.9",
  "cdsapi>=0.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
notebook = ["jupyter>=1.0", "ipykernel>=6.0", "matplotlib>=3.8", "pandas>=2.0"]
all = ["pytest>=8.0", "jupyter>=1.0", "ipykernel>=6.0", "matplotlib>=3.8", "pandas>=2.0"]

[project.urls]
Repository = "https://github.com/YOUR-USERNAME/HumidClimatologyEngine"
Issues = "https://github.com/YOUR-USERNAME/HumidClimatologyEngine/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
